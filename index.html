<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Local Legend</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>:root{--u:min(calc(100vw/1280),calc(100vh/720))}#status{background:linear-gradient(180deg,#0d124d,#5c218f) !important}#status-splash,#status-splash.show-image--false{display:block !important;position:absolute !important;left:calc(50% - 135*var(--u)) !important;right:auto !important;top:calc(50% - 175*var(--u)) !important;bottom:auto !important;margin:0 !important;width:calc(270*var(--u)) !important;height:calc(270*var(--u)) !important;max-width:none !important;max-height:none !important;object-fit:contain !important;animation:ll-heartbeat 1.1s ease-in-out infinite}#status-progress{display:none !important}@keyframes ll-heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}#ll-loader{position:absolute;left:0;right:0;top:calc(50% + 43*var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(12*var(--u));pointer-events:none}#ll-bar{width:calc(262*var(--u));height:calc(28*var(--u));box-sizing:border-box;border:calc(2*var(--u)) solid rgba(255,255,255,.85);border-radius:999px;background:transparent;padding:calc(3*var(--u))}#ll-fill{height:100%;width:0;background:#fff;border-radius:999px}#ll-text{display:flex;font:700 calc(16*var(--u))/1 Arial,Helvetica,sans-serif;color:rgba(255,255,255,.75);animation:ll-fade 1.4s ease-in-out infinite}#ll-dots{display:inline-block;overflow:hidden;width:1ch;text-align:left;font-family:monospace;font-weight:700;animation:ll-dots 1.2s steps(1) infinite}#ll-text .dotbox{display:inline-block;width:1.9em}@keyframes ll-fade{0%,100%{opacity:.3}50%{opacity:1}}@keyframes ll-dots{0%{width:1ch}33.3%{width:2ch}66.6%{width:3ch}}#ll-stars{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden}#ll-stars i{position:absolute;background:#fff;border-radius:50%;animation:ll-twinkle 2s ease-in-out infinite}@keyframes ll-twinkle{0%,100%{opacity:.25}50%{opacity:1}}</style><script>document.addEventListener('DOMContentLoaded',function(){var s=document.getElementById('status');if(!s)return;var w=document.createElement('div');w.id='ll-loader';w.innerHTML='<div id="ll-bar"><div id="ll-fill"></div></div><div id="ll-text">Loading<span class="dotbox"><span id="ll-dots">...</span></span></div>';s.appendChild(w);var st=document.createElement('div');st.id='ll-stars';for(var i=0;i<120;i++){var d=document.createElement('i'),z=2+Math.random()*3;d.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-delay:-'+Math.random()*3+'s;animation-duration:'+(1.6+Math.random()*1.6)+'s';st.appendChild(d);}s.insertBefore(st,s.firstChild);var f=document.getElementById('ll-fill'),t0=Date.now(),shown=0;setInterval(function(){var p=document.getElementById('status-progress'),target;if(p&&p.hasAttribute('value')&&p.max>0){target=p.value/p.max;}else{target=Math.min(0.92,(1-Math.exp(-(Date.now()-t0)/5000))*0.95);}shown+=(target-shown)*0.15;f.style.width=(shown*100)+'%';},50);});</script><script>(function(){var sa=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);if(!sa)return;try{Object.defineProperty(window,'innerHeight',{configurable:true,get:function(){return document.documentElement.clientHeight||window.visualViewport.height;}});Object.defineProperty(window,'innerWidth',{configurable:true,get:function(){return document.documentElement.clientWidth||window.visualViewport.width;}});}catch(e){}if(window.visualViewport){window.visualViewport.addEventListener('resize',function(){window.dispatchEvent(new Event('resize'));});}window.addEventListener('orientationchange',function(){setTimeout(function(){window.dispatchEvent(new Event('resize'));},300);});setInterval(function(){var c=document.querySelector('canvas');if(c&&Math.abs(c.getBoundingClientRect().height-document.documentElement.clientHeight)>2){window.dispatchEvent(new Event('resize'));}},1000);})();</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--false use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":10871988,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
